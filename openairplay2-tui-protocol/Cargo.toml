[package]
name = "openairplay2-tui-protocol"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Wire format for the openairplay2 receiver's now-playing WebSocket"
license = "MIT"
repository = "https://github.com/st3fan/openairplay2"
readme = "../README.md"
keywords = ["airplay", "airplay2", "tui", "websocket", "protocol"]
categories = ["multimedia::audio", "encoding"]
# Published to crates.io: the receiver depends on it, and a crate that a
# published crate depends on must itself be published (#65). The promise is
# not new — every message's exact JSON was already pinned by tests.

# Types only — no serde_json, no tokio: whatever a client uses to move the
# bytes is its own business.
[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
