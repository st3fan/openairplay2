[package]
name = "openairplay2-receiver"
version = "0.1.0"
edition = "2021"
description = "Standalone AirPlay 2 receiver for Linux/ALSA"
license = "MIT"

[dependencies]
openairplay2 = { path = "../openairplay2" }
alsa = "0.12"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
