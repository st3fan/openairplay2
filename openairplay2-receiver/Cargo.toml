[package]
name = "openairplay2-receiver"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Standalone AirPlay 2 receiver for Linux/ALSA"
license = "MIT"
repository = "https://github.com/st3fan/openairplay2"
readme = "../README.md"
keywords = ["airplay", "airplay2", "audio", "receiver", "alsa"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
# The version makes this publishable; the path keeps workspace builds local.
openairplay2 = { path = "../openairplay2", version = "0.1.0" }
alsa = "0.12"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
