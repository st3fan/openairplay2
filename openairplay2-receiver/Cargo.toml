[package]
name = "openairplay2-receiver"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Standalone AirPlay 2 receiver for Linux/ALSA"
license = "MIT"
repository = "https://github.com/st3fan/openairplay2"
readme = "../README.md"
keywords = ["airplay", "airplay2", "audio", "receiver", "alsa"]
categories = ["multimedia::audio", "command-line-utilities"]

# .deb packaging via ../packaging/build-deb.sh: amd64/arm64 natively, armhf
# cross-compiled. Depends are pinned to trixie's package names — identical on
# all three architectures — rather than left to cargo-deb's shlibdeps guess, so
# every release leg produces identical metadata. (The flip side: nothing pins a
# libc6 minimum, so the packages are Debian 13+ / Ubuntu 24.04+ by convention
# rather than by dependency.)
[package.metadata.deb]
name = "openairplay2-receiver"
maintainer = "Stefan Arentz <stefan.arentz@gmail.com>"
copyright = "2026 Stefan Arentz"
extended-description = """\
An AirPlay 2 audio receiver: a Mac or iPhone discovers it over mDNS, pairs \
with it (HomeKit transient pairing, optionally behind a pincode), and streams \
AAC to it; audio comes out of an ALSA device with working pause, seek and \
volume. One sender, one stream, one output — no multi-room grouping."""
section = "sound"
priority = "optional"
# adduser: postinst creates the openairplay2 system user with it.
depends = "libasound2t64, libc6, adduser"
# The receiver runs without Avahi — it warns, is simply undiscoverable, and
# --no-avahi is a supported mode — so this is Recommends, not Depends.
recommends = "avahi-daemon"
# The now-playing display is an optional companion that usually runs on a
# different machine than a headless receiver: Suggests, not Recommends.
suggests = "openairplay2-tui"
assets = [
    ["target/release/openairplay2-receiver", "usr/bin/", "755"],
    [
        "../packaging/openairplay2-receiver.default",
        "etc/default/openairplay2-receiver",
        "640",
    ],
    ["../README.md", "usr/share/doc/openairplay2-receiver/README.md", "644"],
    # Shipped plain rather than gzipped (apt-listchanges reads both; cargo-deb
    # cannot run a compression step) — the 0.4.0 options-file migration notice.
    [
        "../packaging/NEWS.Debian",
        "usr/share/doc/openairplay2-receiver/NEWS.Debian",
        "644",
    ],
]
# A pincode is a secret: root-owned, 0640, and preserved across upgrades.
conf-files = ["/etc/default/openairplay2-receiver"]
maintainer-scripts = "../packaging/debian"

[package.metadata.deb.systemd-units]
unit-scripts = "../packaging"
enable = true
start = true
# An upgrade must swap the running daemon, not leave the old binary serving
# until someone remembers to restart it.
restart-after-upgrade = true

[dependencies]
# The version makes this publishable; the path keeps workspace builds local.
openairplay2 = { path = "../openairplay2", version = "0.4.0" }
alsa = "0.12"
# Raw ALSA for the playback stream: the safe `alsa` wrapper does not expose
# snd_pcm_rewind or the silence sw-params we need to keep the stream running
# (never drop/restart) so a track switch does not pop. (alsa-sys is already
# in the tree via alsa; naming it directly lets the sink call those.)
alsa-sys = "0.6"
# errno constants for triaging the ALSA startup probe.
libc = "0.2"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "net",
    "time",
] }

# The now-playing WebSocket (--tui-listen). Off unless asked for, but the
# handful of crates it costs are always linked; tokio-tungstenite over a plain
# TcpListener is the small standard choice, no HTTP stack involved.
openairplay2-tui-protocol = { path = "../openairplay2-tui-protocol", version = "0.4.0" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde_json = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }

# The endpoint's tests drive it with a real WebSocket client; "connect" is
# only needed for that, so it stays out of the shipped binary.
[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "connect",
] }
