[package]
name = "openairplay2"
version = "0.5.0"
edition = "2021"
# The floor set by our dependencies (plist, time); CI tests current stable.
rust-version = "1.88"
description = "Embeddable AirPlay 2 audio receiver library (network in, PCM + events out)"
license = "MIT"
repository = "https://github.com/st3fan/openairplay2"
documentation = "https://docs.rs/openairplay2"
readme = "../README.md"
keywords = ["airplay", "airplay2", "audio", "receiver", "raop"]
categories = ["multimedia::audio", "network-programming"]

# No audio-output dependency here: the host owns PCM → speaker. This crate
# must keep building (and its tests passing) on macOS as well as Linux.
[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
log = "0.4"
num-bigint = "0.4"
plist = "1"
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
# macros: `tokio::select!` in the control-connection loop, which races the
# next request against a takeover by another sender. (Without it the crate
# builds here through workspace feature unification but fails to package
# standalone — which is what `cargo package --workspace` in CI catches.)
tokio = { version = "1", features = [
    "rt",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
# test-util: the takeover timeout is asserted on a paused clock, so the test
# does not actually wait for it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
