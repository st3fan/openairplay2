[package]
name = "openairplay2-tui"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Full-screen now-playing display for an openairplay2 receiver"
license = "MIT"
repository = "https://github.com/st3fan/openairplay2"
readme = "../README.md"
keywords = ["airplay", "airplay2", "tui", "now-playing", "terminal"]
categories = ["multimedia::audio", "command-line-utilities"]
# Not on crates.io yet — see openairplay2-tui-protocol.
publish = false

# It depends on neither `openairplay2` nor ALSA: this is a WebSocket client
# and a renderer, which is what lets it run on a laptop (macOS included)
# watching a receiver on a Linux box.
[dependencies]
openairplay2-tui-protocol = { path = "../openairplay2-tui-protocol" }
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# One format, one small decoder: Kitty wants raw pixels and senders send JPEG.
# The `image` crate would pull in far more for this.
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
log = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "connect",
] }
