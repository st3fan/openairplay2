[package]
name = "openairplay2-tui"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Full-screen now-playing display for an openairplay2 receiver"
license = "MIT"
repository = "https://github.com/st3fan/openairplay2"
readme = "../README.md"
keywords = ["airplay", "airplay2", "tui", "now-playing", "terminal"]
categories = ["multimedia::audio", "command-line-utilities"]
# Not on crates.io: this is an application, distributed as a .deb (below) —
# whether it should also be `cargo install`-able is a separate decision.
publish = false

# .deb packaging via ../packaging/build-deb.sh, beside the receiver's package
# (see plans/20260807-03-tui-deb.md). An interactive terminal program, not a
# daemon: no systemd unit, no system user, no conffile — the binary, the
# README, and the ARMv6 preinst guard are the whole package. Depends is pinned
# by hand like the receiver's, so all three architecture legs produce
# identical metadata.
[package.metadata.deb]
name = "openairplay2-tui"
maintainer = "Stefan Arentz <stefan.arentz@gmail.com>"
copyright = "2026 Stefan Arentz"
extended-description = """\
A full-screen now-playing display for an openairplay2 receiver: track title, \
artist and album, playback position, volume, and the cover art drawn as a \
real image on terminals that support Kitty or iTerm2 graphics. It watches a \
receiver over a WebSocket — start openairplay2-receiver with --tui-listen \
(on this or any other machine) and point openairplay2-tui --connect at it."""
section = "sound"
priority = "optional"
depends = "libc6"
assets = [
    ["target/release/openairplay2-tui", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/openairplay2-tui/README.md", "644"],
]
maintainer-scripts = "../packaging/tui-debian"

# It depends on neither `openairplay2` nor ALSA: this is a WebSocket client
# and a renderer, which is what lets it run on a laptop (macOS included)
# watching a receiver on a Linux box.
[dependencies]
openairplay2-tui-protocol = { path = "../openairplay2-tui-protocol", version = "0.4.0" }
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# One format, one small decoder: Kitty wants raw pixels and senders send JPEG.
# The `image` crate would pull in far more for this.
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
log = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "connect",
] }
