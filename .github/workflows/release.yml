# Release: publishing a GitHub Release is the ONLY event that ships anything.
# Nothing releases from a push or a pull request.
#
# This workflow is only the dispatcher: it checks the tag against the crate
# version and then calls the two workflows that do the work, which run in
# parallel and can also be run on their own:
#
#   cargo.yml    publish both crates to crates.io
#   debian.yml   build the .debs (amd64 + arm64 + armhf, in parallel) and attach them
#
# The filename matters: crates.io Trusted Publishing is configured for
# release.yml, so the crates.io job must keep being reached from here.
name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the single version for the release, and it must equal the crate
  # version exactly — prereleases included. A prerelease is not an exception:
  # to cut vX.Y.Z-rcN, the crate version must also be X.Y.Z-rcN, so crates.io
  # gets a proper prerelease. (A warn-only prerelease path once let a
  # `v0.4.0-rc1` tag publish crate version `0.4.0` — the final number, spent on
  # a candidate. Never again: mismatch fails the release before anything ships.)
  version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag with openairplay2-receiver/Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' openairplay2-receiver/Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $TAG does not match openairplay2-receiver/Cargo.toml version $crate — bump the crate version to $version (including any -rcN) before releasing"
            exit 1
          fi

  cargo:
    name: crates.io
    needs: version
    permissions:
      id-token: write # crates.io Trusted Publishing (OIDC)
      contents: read
    uses: ./.github/workflows/cargo.yml

  debian:
    name: Debian packages
    needs: version
    permissions:
      contents: write # attach the .debs to the release
      id-token: write # sign the build provenance attestation
      attestations: write
    uses: ./.github/workflows/debian.yml
    with:
      tag: ${{ github.event.release.tag_name }}
