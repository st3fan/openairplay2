# Release: publishing a GitHub Release is the ONLY event that ships anything.
# Nothing releases from a push or a pull request.
#
# This workflow is only the dispatcher: it checks the tag against the crate
# version and then calls the two workflows that do the work, which run in
# parallel and can also be run on their own:
#
#   cargo.yml    publish both crates to crates.io
#   debian.yml   build the .debs (amd64 + arm64 + armhf, in parallel) and attach them
#
# The filename matters: crates.io Trusted Publishing is configured for
# release.yml, so the crates.io job must keep being reached from here.
name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the single version for the release. Strict for real releases;
  # warn-only for prereleases, so vX.Y.Z-rcN tags can exercise this workflow.
  version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with openairplay2-receiver/Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' openairplay2-receiver/Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            message="tag $TAG does not match openairplay2-receiver/Cargo.toml version $crate"
            if [ "$PRERELEASE" = "true" ]; then
              echo "::warning::$message (allowed: prerelease)"
            else
              echo "::error::$message"
              exit 1
            fi
          fi

  cargo:
    name: crates.io
    needs: version
    permissions:
      id-token: write # crates.io Trusted Publishing (OIDC)
      contents: read
    uses: ./.github/workflows/cargo.yml

  debian:
    name: Debian packages
    needs: version
    permissions:
      contents: write # attach the .debs to the release
      id-token: write # sign the build provenance attestation
      attestations: write
    uses: ./.github/workflows/debian.yml
    with:
      tag: ${{ github.event.release.tag_name }}
