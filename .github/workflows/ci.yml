# CI: the full workspace on Linux (the target platform), and the library
# alone on macOS — the library's macOS portability is a deliverable
# (see CLAUDE.md), enforced here rather than by discipline.
name: CI

# Documentation-only changes (plans, notes, the README) don't affect the
# build or the tests, so skip CI when a push or PR touches nothing but
# Markdown. Safe because no status check here is a required merge gate; if one
# ever becomes required, drop these filters (a required check that never runs
# blocks the merge).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      # A manifest that cannot publish should fail a PR, not a release (#65).
      # Workspace packaging verifies dependents against the just-packaged
      # local crates, so it works even when the versions aren't on crates.io.
      - run: cargo package --workspace

  macos:
    name: macOS (library + display)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The library's macOS portability is a deliverable; so is the display's,
      # which is why it depends on neither the library nor ALSA — you run it on
      # a laptop watching a Linux receiver.
      - run: cargo test -p openairplay2 -p openairplay2-tui-protocol -p openairplay2-tui
      - run: cargo clippy -p openairplay2 -p openairplay2-tui-protocol -p openairplay2-tui --all-targets -- -D warnings
