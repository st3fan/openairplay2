# Builds the openairplay2-receiver and openairplay2-tui .deb packages for
# amd64, arm64 and armhf — six packages — and, when called with a release tag,
# attaches them to that GitHub Release.
#
# amd64 and arm64 build NATIVELY: amd64 on ubuntu-latest, arm64 on the free
# public arm64 runners. armhf (Debian's ARMv7 port) cross-compiles on an amd64
# host via Debian multiarch, because no 32-bit ARM runners exist — its tests
# are therefore not run; the other two legs cover them. All three run in
# parallel inside debian:trixie containers, so the binaries link against
# Debian 13's glibc and ALSA.
#
# Called by release.yml; can also be run by hand from the Actions tab to
# smoke-test a packaging change (no tag → the packages are built and kept as
# workflow artifacts, and nothing is attached anywhere).
name: Debian packages

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the packages to; empty = build only
        type: string
        required: false
        default: ""
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.arch }}
    # id-token + attestations: sign SLSA build provenance for the .deb
    # (verify with `gh attestation verify`). This job never writes the repo.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # One leg's failure (a runner or docker-pull flake, or armhf breaking)
      # must not cancel the other architectures' builds.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            setup: native
          - arch: arm64
            runner: ubuntu-24.04-arm
            setup: native
          - arch: armhf
            runner: ubuntu-latest
            setup: cross
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      # git must be present before checkout, or actions/checkout silently
      # falls back to a tarball download without a .git directory. The rest
      # comes from packaging/setup-build.sh once the checkout exists, so CI
      # and the build box install the same set.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./packaging/setup-build.sh ${{ matrix.setup }}

      # trixie's rustc is older than the crates' rust-version; use rustup.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # The armhf leg cross-compiles on an amd64 host; its binaries cannot be
      # executed here, and the amd64 leg runs the same tests anyway.
      - name: Test
        if: matrix.setup == 'native'
        run: cargo test --workspace

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # Native and cross builds land in different directories, so the script
      # reports the paths it produced rather than the workflow globbing for
      # them.
      - name: Build .debs
        id: build
        run: ./packaging/build-deb.sh ${{ matrix.arch }}

      # Each package gets its own provenance attestation.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.build.outputs.receiver_deb }}
            ${{ steps.build.outputs.tui_deb }}

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.receiver_deb }}
            ${{ steps.build.outputs.tui_deb }}
          if-no-files-found: error

  assets:
    name: Attach to release
    needs: build
    if: inputs.tag != ''
    # Not containerized: this job only moves files, and the runner image
    # already has the gh CLI.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach .debs and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" --clobber -- *
